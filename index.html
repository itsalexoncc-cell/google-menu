<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Google</title>
<link rel="apple-touch-icon" href="icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://fonts.googleapis.com/css2?family=Product+Sans&display=swap" rel="stylesheet">
<style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    html, body{
        width:100%; height:100%;
        background:#f1f3f4;
        font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    }

    body{
        display:flex; flex-direction:column; align-items:center;
        padding: calc(env(safe-area-inset-top) + 60px) 44px 20px 44px;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-in { opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .google-logo{
        font-family: 'Product Sans', sans-serif;
        font-size: 48px; margin-bottom: 24px;
    }
    .g-blue{color:#4285F4;} .g-red{color:#EA4335;} 
    .g-yellow{color:#FBBC05;} .g-green{color:#34A853;}

    .search-wrapper {
        position: relative;
        width: 100%;
        margin-bottom: 48px;
    }

    .search-glow {
        position: absolute;
        inset: -3px;
        border-radius: 31px;
        background: linear-gradient(90deg, 
            #4285F4, #EA4335, #FBBC05, #34A853, 
            #4285F4, #EA4335, #FBBC05, #34A853);
        background-size: 300% 300%;
        animation: borderRotate 6s linear infinite;
        z-index: 0;
    }

    .search-bar{
        position: relative;
        width: 100%; 
        background: white; 
        border-radius: 28px;
        display:flex; 
        align-items:center; 
        padding:14px 20px; 
        gap:12px;
        box-shadow:0 2px 8px rgba(0,0,0,.12);
        z-index: 1;
    }

    .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: #202124;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .search-bar input::placeholder { color: #9aa0a6; }

    .search-bar button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
    }

    @keyframes borderRotate {
        0%   { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
    }

    .grid{ width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap: 44px; }
    .app{ text-decoration:none; display:flex; justify-content:center; align-items:center; opacity:0; }
    .icon{
        width: 88px; height: 88px; border-radius:28px;
        box-shadow:0 4px 16px rgba(0,0,0,.15);
        object-fit:cover; background:#e8eaed;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app:active .icon{ transform:scale(0.85); }
</style>
</head>
<body>

    <div class="google-logo animate-in">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </div>

    <div class="search-wrapper animate-in" style="animation-delay: 0.1s">
        <div class="search-glow"></div>
        <form class="search-bar" action="https://www.google.com/search" method="GET" target="_blank">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="#9aa0a6" stroke-width="2.2"/>
                <path d="M16.5 16.5L21 21" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <input type="text" name="q" placeholder="Поиск в Google" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button type="submit">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <rect x="9" y="2" width="6" height="12" rx="3" fill="#4285F4"/>
                    <path d="M5 11a7 7 0 0014 0" stroke="#34A853" stroke-width="2" stroke-linecap="round" fill="none"/>
                    <line x1="12" y1="18" x2="12" y2="22" stroke="#EA4335" stroke-width="2" stroke-linecap="round"/>
                    <line x1="9" y1="22" x2="15" y2="22" stroke="#EA4335" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </form>
    </div>

    <div class="grid" id="appsGrid"></div>

<script>
const apps = [
    { id:"1150085200", name:"Family Link", scheme:"itms-apps://itunes.apple.com/app/id1150085200" },
    { id:"962194608",  name:"Фото",        scheme:"googlephotos://" },
    { id:"507874739",  name:"Диск",        scheme:"googledrive://" },
    { id:"680819774",  name:"Home",        scheme:"googlehome://" },
    { id:"842849113",  name:"Sheets",      scheme:"googlesheets://" },
    { id:"439438619",  name:"Snapseed",    scheme:"itms-apps://itunes.apple.com/app/id439438619" },
    { id:"422689480",  name:"Gmail",       scheme:"googlegmail://" },
    { id:"544007664",  name:"YouTube",     scheme:"youtube://" },
    { id:"1451784328", name:"Google One",  scheme:"itms-apps://itunes.apple.com/app/id1451784328" }
];

// Очищаем поиск при возврате на страницу
window.addEventListener('pageshow', () => document.querySelector('input[name="q"]').value = '');
window.addEventListener('focus', () => document.querySelector('input[name="q"]').value = '');

const ids = apps.map(a => a.id).join(",");
fetch(`https://itunes.apple.com/lookup?id=${ids}&entity=software`)
.then(r => r.json())
.then(data => {
    const iconMap = {};
    data.results.forEach(app => { iconMap[String(app.trackId)] = app.artworkUrl512 || app.artworkUrl100; });
    const grid = document.getElementById("appsGrid");
    grid.innerHTML = apps.map((app, index) => `
        <a class="app animate-in" style="animation-delay: ${0.2 + (index * 0.05)}s" href="${app.scheme}" onclick="window.location.href='${app.scheme}';return false;">
            <img class="icon" src="${iconMap[app.id] || ''}" alt="${app.name}">
        </a>`).join("");
});
</script>
</body>
</html>
