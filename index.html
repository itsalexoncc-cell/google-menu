<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Google Apps</title>
<link rel="apple-touch-icon" href="icon.JPG">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Google Apps">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:60px 20px;background:#efeff4;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#000}
.title{text-align:center;font-size:18px;font-weight:600;letter-spacing:4px;color:#8e8e93;margin-bottom:22px}
.card{background:rgba(255,255,255,.78);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-radius:32px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.item{display:flex;align-items:center;text-decoration:none;color:#000;padding:14px 20px;border-bottom:1px solid rgba(0,0,0,.06)}
.item:last-child{border-bottom:none}
.item:active{opacity:.5}
.icon{width:44px;height:44px;border-radius:12px;margin-right:16px;flex-shrink:0;background:#eee}
.name{font-size:19px;font-weight:400}
.arrow{margin-left:auto;font-size:26px;color:#c7c7cc;font-weight:300;padding-left:8px}
.footer{margin-top:22px;text-align:center;font-size:13px;color:#8e8e93}
</style>
</head>
<body>

<div class="title">GOOGLE APPS</div>
<div class="card" id="list">
  <div style="padding:20px;text-align:center;color:#8e8e93">Загрузка иконок...</div>
</div>
<div class="footer">iOS Google Launcher</div>

<script>
// App Store ID => { name, scheme }
const apps = [
  { id: "1150085200", name: "Family Link",   scheme: "familylink://"     },
  { id: "962194608",  name: "Google Фото",   scheme: "googlephotos://"   },
  { id: "507874739",  name: "Google Диск",   scheme: "googledrive://"    },
  { id: "680819774",  name: "Google Home",   scheme: "googlehome://",     fallback: "https://play-lh.googleusercontent.com/-UJfyCGXOGNlA_7ys13IRTRxnrA5NGick84oQx-dBTr2swpki2xGIlHPcQaF46H21-u4=w240-h480" },
  { id: "842849113",  name: "Google Sheets", scheme: "googlesheets://"   },
  { id: "439438619",  name: "Snapseed",      scheme: "snapseed://",       fallback: "https://play-lh.googleusercontent.com/AjGiztl_jbo5jLlL6ohjO03TKy1cC8BE6xZSQvN4L7x_VK05Pagnrj0WRaZWIF9ywQw=w240-h480" },
  { id: "422689480",  name: "Gmail",         scheme: "googlegmail://"    },
  { id: "544007664",  name: "YouTube",       scheme: "youtube://"        },
  { id: "1451784328", name: "Google One",    scheme: "googleone://"      },
];

const ids = apps.map(a => a.id).join(",");

fetch(`https://itunes.apple.com/lookup?id=${ids}&entity=software`)
  .then(r => r.json())
  .then(data => {
    const iconMap = {};
    data.results.forEach(r => {
      iconMap[String(r.trackId)] = r.artworkUrl100;
    });

    const list = document.getElementById("list");
    list.innerHTML = apps.map(app => {
      const icon = iconMap[app.id] || app.fallback || "";
      return `
        <a class="item" href="${app.scheme}">
          <img class="icon" src="${icon}" />
          <div class="name">${app.name}</div>
          <div class="arrow">›</div>
        </a>`;
    }).join("");
  })
  .catch(() => {
    const list = document.getElementById("list");
    list.innerHTML = apps.map(app => `
      <a class="item" href="${app.scheme}">
        <img class="icon" src="${app.fallback || ''}" />
        <div class="name">${app.name}</div>
        <div class="arrow">›</div>
      </a>`).join("");
  });
</script>

</body>
</html>
