<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Google Apps</title>

<link rel="apple-touch-icon" href="icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Google Apps">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    background:#000;
    position:relative;
}

/* Размытый фон */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        url("./folder-bg.jpg")
        center center /
        cover
        no-repeat;

    filter:blur(12px);
    transform:scale(1.08);

    z-index:0;
}

/* Контейнер */

.launcher{
    position:relative;
    z-index:1;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* Заголовок над папкой */

.title{
    color:white;

    font-size:30px;
    font-weight:700;

    margin-bottom:18px;

    text-shadow:
        0 2px 10px rgba(0,0,0,.35);
}

/* Папка */

.folder{

    width:min(95vw,520px);

    border-radius:42px;

    background:
        rgba(255,255,255,.08);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    border:
        1px solid rgba(255,255,255,.16);

    box-shadow:
        0 20px 60px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.12);

    padding:28px;

    animation:openFolder .22s ease-out;
}

@keyframes openFolder{

    from{
        opacity:0;
        transform:scale(.92);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

/* Сетка */

.grid{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:26px;
}

/* Приложение */

.app{
    text-decoration:none;
    color:white;
    text-align:center;
}

.app:active{
    transform:scale(.92);
}

.icon{

    width:72px;
    height:72px;

    display:block;
    margin:auto;

    border-radius:18px;

    box-shadow:
        0 4px 14px rgba(0,0,0,.18);
}

.name{

    margin-top:8px;

    font-size:13px;

    text-shadow:
        0 1px 4px rgba(0,0,0,.45);

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

</style>
</head>
<body>

<div class="launcher">

    <div class="title">
        Google Apps
    </div>

    <div class="folder">

        <div class="grid" id="appsGrid">

            <div style="color:white;text-align:center;grid-column:1/-1">
                Загрузка...
            </div>

        </div>

    </div>

</div>

<script>

const apps = [

{
id:"1150085200",
name:"Family Link",
scheme:"itms-apps://itunes.apple.com/app/id1150085200"
},

{
id:"962194608",
name:"Фото",
scheme:"googlephotos://"
},

{
id:"507874739",
name:"Диск",
scheme:"googledrive://"
},

{
id:"680819774",
name:"Home",
scheme:"googlehome://"
},

{
id:"842849113",
name:"Sheets",
scheme:"googlesheets://"
},

{
id:"439438619",
name:"Snapseed",
scheme:"itms-apps://itunes.apple.com/app/id439438619"
},

{
id:"422689480",
name:"Gmail",
scheme:"googlegmail://"
},

{
id:"544007664",
name:"YouTube",
scheme:"youtube://"
},

{
id:"1451784328",
name:"Google One",
scheme:"itms-apps://itunes.apple.com/app/id1451784328"
}

];

const ids = apps.map(a => a.id).join(",");

fetch(`https://itunes.apple.com/lookup?id=${ids}&entity=software`)
.then(r => r.json())
.then(data => {

const iconMap = {};

data.results.forEach(app => {

iconMap[String(app.trackId)] =
app.artworkUrl512 ||
app.artworkUrl100;

});

const grid =
document.getElementById("appsGrid");

grid.innerHTML =
apps.map(app => {

const icon =
iconMap[app.id] || "";

return `

<a class="app"
href="${app.scheme}"
onclick="window.location.href='${app.scheme}';return false;">

<img
class="icon"
src="${icon}"
alt="${app.name}">

<div class="name">
${app.name}
</div>

</a>

`;

}).join("");

});

</script>

</body>
</html>
