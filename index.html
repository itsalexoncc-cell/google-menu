<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Google</title>
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Google">
<!-- Неблокирующая загрузка шрифта, чтобы страница не зависала при плохом интернете -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Product+Sans&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Product+Sans&display=swap"></noscript>
<style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

    html, body{
        width:100%; height:100%;
        background:#f1f3f4;
        font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    }

    body{
        display:flex; flex-direction:column; align-items:center;
        padding: calc(env(safe-area-inset-top) + 60px) 44px 20px 44px;
    }

    @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-in { opacity: 0; animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    .google-logo{
        font-family: 'Product Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 48px; margin-bottom: 24px;
        user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
        cursor: pointer;
    }
    .g-blue{color:#4285F4;} .g-red{color:#EA4335;} 
    .g-yellow{color:#FBBC05;} .g-green{color:#34A853;}

    .search-wrapper {
        position: relative;
        width: 100%;
        margin-bottom: 48px;
    }

    .search-glow {
        position: absolute;
        inset: -3px;
        border-radius: 31px;
        background: linear-gradient(90deg, 
            #4285F4, #EA4335, #FBBC05, #34A853, 
            #4285F4, #EA4335, #FBBC05, #34A853);
        background-size: 300% 300%;
        animation: borderRotate 6s linear infinite;
        z-index: 0;
    }

    .search-bar{
        position: relative;
        width: 100%; 
        background: white; 
        border-radius: 28px;
        display:flex; 
        align-items:center; 
        padding:14px 20px; 
        gap:12px;
        box-shadow:0 2px 8px rgba(0,0,0,.12);
        z-index: 1;
    }

    .search-bar input {
        flex: 1;
        border: none;
        outline: none;
        font-size: 16px;
        color: #202124;
        background: transparent;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .search-bar input::placeholder { color: #9aa0a6; }

    .search-bar button {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        display: flex;
        align-items: center;
    }

    @keyframes borderRotate {
        0%   { background-position: 0% 50%; }
        100% { background-position: 300% 50%; }
    }

    .grid{ width:100%; display:grid; grid-template-columns:repeat(3,1fr); gap: 44px; }
    .app{ text-decoration:none; display:flex; justify-content:center; align-items:center; opacity:0; }
    .icon{
        width: 88px; height: 88px; border-radius:28px;
        box-shadow:0 4px 16px rgba(0,0,0,.15);
        object-fit:cover; background:#e8eaed;
        transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app:active .icon{ transform:scale(0.85); }

    /* Невидимое уведомление для скрытого сброса кэша (появляется только при активации) */
    .reset-status {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom) + 20px);
        left: 50%;
        transform: translateX(-50%);
        background: rgba(32, 33, 36, 0.85);
        color: #fff;
        font-size: 13px;
        padding: 8px 16px;
        border-radius: 20px;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        white-space: nowrap;
        z-index: 100;
    }
    .reset-status.visible { opacity: 1; }
</style>
</head>
<body>

    <div class="google-logo animate-in" id="logoReset">
        <span class="g-blue">G</span><span class="g-red">o</span><span class="g-yellow">o</span><span class="g-blue">g</span><span class="g-green">l</span><span class="g-red">e</span>
    </div>

    <div class="search-wrapper animate-in" style="animation-delay: 0.1s">
        <div class="search-glow"></div>
        <form class="search-bar" action="https://www.google.com/search" method="GET" target="_blank">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="#9aa0a6" stroke-width="2.2"/>
                <path d="M16.5 16.5L21 21" stroke="#9aa0a6" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
            <input type="text" name="q" placeholder="Поиск в Google" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
            <button type="submit">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
                    <rect x="9" y="2" width="6" height="12" rx="3" fill="#4285F4"/>
                    <path d="M5 11a7 7 0 0014 0" stroke="#34A853" stroke-width="2" stroke-linecap="round" fill="none"/>
                    <line x1="12" y1="18" x2="12" y2="22" stroke="#EA4335" stroke-width="2" stroke-linecap="round"/>
                    <line x1="9" y1="22" x2="15" y2="22" stroke="#EA4335" stroke-width="2" stroke-linecap="round"/>
                </svg>
            </button>
        </form>
    </div>

    <div class="grid" id="appsGrid"></div>
    <div class="reset-status" id="resetStatus"></div>

<script>
// Убираем технический параметр ?refresh=... после принудительного сброса
if (window.location.search.includes('refresh=')) {
    try {
        history.replaceState(null, '', window.location.pathname);
    } catch (e) {}
}

const apps = [
    { id:"1150085200", name:"Family Link", scheme:"comgooglefamilylink://" },
    { id:"962194608",  name:"Фото",        scheme:"googlephotos://" },
    { id:"507874739",  name:"Диск",        scheme:"googledrive://" },
    { id:"680819774",  name:"Home",        scheme:"googlehome://", fallback:"https://play-lh.googleusercontent.com/-UJfyCGXOGNlA_7ys13IRTRxnrA5NGick84oQx-dBTr2swpki2xGIlHPcQaF46H21-u4=w240-h480" },
    { id:"842849113",  name:"Sheets",      scheme:"googlesheets://" },
    { id:"439438619",  name:"Snapseed",    scheme:"googlesnapseed://", fallback:"https://play-lh.googleusercontent.com/AjGiztl_jbo5jLlL6ohjO03TKy1cC8BE6xZSQvN4L7x_VK05Pagnrj0WRaZWIF9ywQw=w240-h480" },
    { id:"422689480",  name:"Gmail",       scheme:"googlegmail://" },
    { id:"544007664",  name:"YouTube",     scheme:"youtube://" },
    { id:"1451784328", name:"Google One",  scheme:"com.google.sso.248712546936-2aao69tj2la32n6v27b0dq23eu5775vp://" }
];

const STORAGE_KEY = 'google_apps_icons_cache';
const EMPTY_IMG = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';

// Очищаем поиск при возврате на страницу
const clearSearch = () => {
    const input = document.querySelector('input[name="q"]');
    if (input) input.value = '';
};
window.addEventListener('pageshow', clearSearch);
window.addEventListener('focus', clearSearch);

// 1. Мгновенный рендер сетки из localStorage (работает даже без интернета)
let cachedIcons = {};
try {
    cachedIcons = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
} catch (e) {}

const grid = document.getElementById("appsGrid");
grid.innerHTML = apps.map((app, index) => {
    const src = cachedIcons[app.id] || app.fallback || EMPTY_IMG;
    return `
        <a class="app animate-in" style="animation-delay: ${0.2 + (index * 0.05)}s" href="${app.scheme}" onclick="window.location.href='${app.scheme}';return false;">
            <img class="icon" data-app-id="${app.id}" src="${src}" alt="${app.name}">
        </a>`;
}).join("");

// 2. Фоновое обновление иконок с iTunes API без повторного мигания анимации
if (navigator.onLine) {
    const ids = apps.map(a => a.id).join(",");
    fetch(`https://itunes.apple.com/lookup?id=${ids}&entity=software`)
        .then(r => r.json())
        .then(data => {
            const freshIcons = { ...cachedIcons };
            data.results.forEach(app => {
                freshIcons[String(app.trackId)] = app.artworkUrl512 || app.artworkUrl100;
            });

            if (JSON.stringify(freshIcons) !== JSON.stringify(cachedIcons)) {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(freshIcons));
                apps.forEach(app => {
                    const newSrc = freshIcons[app.id] || app.fallback;
                    if (!newSrc) return;
                    const img = grid.querySelector(`img[data-app-id="${app.id}"]`);
                    if (img && img.src !== newSrc) {
                        img.src = newSrc;
                    }
                });
            }
        })
        .catch(() => {});
}

// 3. Регистрация Service Worker
if ('serviceWorker' in navigator) {
    navigator.serviceWorker
        .register('./sw.js', { scope: './', updateViaCache: 'none' })
        .catch(() => {});
}

// 4. Скрытый сброс кэша PWA: 5 быстрых нажатий по логотипу Google
(function setupHiddenReset() {
    const logo = document.getElementById('logoReset');
    const status = document.getElementById('resetStatus');
    let tapCount = 0;
    let tapTimer = null;
    let statusTimer = null;
    let isResetting = false;

    const showStatus = (text, autoHide = true) => {
        clearTimeout(statusTimer);
        status.textContent = text;
        status.classList.add('visible');
        if (autoHide) {
            statusTimer = setTimeout(() => status.classList.remove('visible'), 2500);
        }
    };

    logo.addEventListener('click', async () => {
        if (isResetting) return;

        tapCount++;
        clearTimeout(tapTimer);

        if (tapCount < 5) {
            tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
            return;
        }

        tapCount = 0;

        if (!navigator.onLine) {
            showStatus('Нет сети — сброс отменён');
            return;
        }

        isResetting = true;
        showStatus('Сброс кэша...', false);

        try {
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(key => caches.delete(key)));
            }
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                await Promise.all(registrations.map(reg => reg.unregister()));
            }
            try {
                localStorage.removeItem(STORAGE_KEY);
            } catch (e) {}

            showStatus('Обновление...', false);
            window.location.replace(window.location.pathname + '?refresh=' + Date.now());
        } catch (e) {
            isResetting = false;
            showStatus('Ошибка сброса');
        }
    });
})();
</script>
</body>
</html>
