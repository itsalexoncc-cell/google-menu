<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Google Apps</title>

<link rel="apple-touch-icon" href="icon.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Google Apps">

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    height:100vh;

    display:flex;
    justify-content:center;
    align-items:center;

    font-family:-apple-system,BlinkMacSystemFont,sans-serif;

    background:#000;
    overflow:hidden;
}

/* Фон рабочего стола */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:url("folder-bg.PNG") center center / cover no-repeat;

    filter:blur(45px);
    transform:scale(1.15);
}

/* Папка */

.folder{
    position:relative;

    width:min(92vw,420px);

    border-radius:38px;

    background:
        rgba(255,255,255,.14);

    backdrop-filter:blur(40px);
    -webkit-backdrop-filter:blur(40px);

    border:1px solid rgba(255,255,255,.18);

    box-shadow:
        0 25px 80px rgba(0,0,0,.25),
        inset 0 1px 0 rgba(255,255,255,.15);

    overflow:hidden;

    animation:openFolder .22s ease-out;
}

@keyframes openFolder{

    from{
        opacity:0;
        transform:scale(.88);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.title{
    text-align:center;

    color:white;

    font-size:18px;
    font-weight:600;

    padding:18px 0 10px;

    letter-spacing:.3px;
}

/* Сетка */

.grid{
    display:grid;

    grid-template-columns:repeat(4,1fr);

    gap:22px;

    padding:22px 24px 28px;
}

.app{
    text-decoration:none;
    text-align:center;
    color:white;
}

.app:active{
    transform:scale(.92);
}

.icon{
    width:64px;
    height:64px;

    border-radius:16px;

    box-shadow:
        0 4px 15px rgba(0,0,0,.18);

    display:block;
    margin:auto;
}

.name{
    margin-top:7px;

    font-size:11px;

    line-height:1.2;

    text-shadow:
        0 1px 4px rgba(0,0,0,.5);

    overflow:hidden;
}

.footer{
    text-align:center;

    padding-bottom:18px;

    color:rgba(255,255,255,.65);

    font-size:11px;
}

</style>
</head>
<body>

<div class="folder">

    <div class="title">
        Google Apps
    </div>

    <div class="grid" id="appsGrid">

        <div style="color:white;text-align:center;width:100%;grid-column:1/-1">
            Загрузка...
        </div>

    </div>

    <div class="footer">
        iOS Folder Style
    </div>

</div>

<script>

const apps = [

  {
    id:"1150085200",
    name:"Family Link",
    scheme:"itms-apps://itunes.apple.com/app/id1150085200"
  },

  {
    id:"962194608",
    name:"Фото",
    scheme:"googlephotos://"
  },

  {
    id:"507874739",
    name:"Диск",
    scheme:"googledrive://"
  },

  {
    id:"680819774",
    name:"Home",
    scheme:"googlehome://"
  },

  {
    id:"842849113",
    name:"Sheets",
    scheme:"googlesheets://"
  },

  {
    id:"439438619",
    name:"Snapseed",
    scheme:"itms-apps://itunes.apple.com/app/id439438619"
  },

  {
    id:"422689480",
    name:"Gmail",
    scheme:"googlegmail://"
  },

  {
    id:"544007664",
    name:"YouTube",
    scheme:"youtube://"
  },

  {
    id:"1451784328",
    name:"Google One",
    scheme:"itms-apps://itunes.apple.com/app/id1451784328"
  }

];

const ids = apps.map(a=>a.id).join(",");

fetch(`https://itunes.apple.com/lookup?id=${ids}&entity=software`)
.then(r=>r.json())
.then(data=>{

    const iconMap={};

    data.results.forEach(app=>{

        iconMap[String(app.trackId)] =
        app.artworkUrl512 ||
        app.artworkUrl100;

    });

    const grid =
    document.getElementById("appsGrid");

    grid.innerHTML =
    apps.map(app=>{

        const icon =
        iconMap[app.id] || "";

        return `

        <a class="app"
           href="${app.scheme}"
           onclick="window.location='${app.scheme}';return false;">

            <img
                class="icon"
                src="${icon}"
            >

            <div class="name">
                ${app.name}
            </div>

        </a>

        `;

    }).join("");

});

</script>

</body>
</html>
